name: Part 1 Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required directories
        run: |
          test -d docs
          test -d .github/workflows

      - name: Check required Part 1 files
        run: |
          test -f docs/RaceDay_ERD_sketch.pdf
          test -f docs/RaceDay_API_Endpoint_Plan.docx
          test -f docs/RaceDay_Database.sql
          test -f docs/Part1_Project_Structure.md

      - name: Part 1 validation successful
        run: echo "All required Part 1 files are present."
